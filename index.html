<!doctype html>
<html>
  <head>
    <title>Time Capsule</title>
    <style>
      body {
        font-family: Arial;
        background: #eef2f3;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        background: white;
        padding: 20px;
        width: 320px;
        border-radius: 8px;
        text-align: center;
      }
      input,
      textarea,
      button {
        width: 100%;
        margin: 6px 0;
        padding: 8px;
      }
      button {
        background: #4caf50;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h3>⏳ Time Capsule</h3>

      <textarea id="message" placeholder="Message"></textarea>
      <input type="datetime-local" id="date" />
      <button onclick="createCapsule()">Create Capsule</button>

      <hr />

      <input type="number" id="capsuleId" placeholder="Capsule ID" />
      <button onclick="openCapsule()">Open Capsule</button>

      <p id="result"></p>
    </div>

    <script>
      function createCapsule() {
        fetch("/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: document.getElementById("message").value,
            unlockDate: document.getElementById("date").value,
          }),
        })
          .then((res) => res.json())
          .then((data) => alert("Capsule ID: " + data.id));
      }

      function openCapsule() {
        const id = document.getElementById("capsuleId").value;

        fetch("/open/" + id)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("result").innerText =
              data.message || data.status;
          });
      }
    </script>
  </body>
</html>
